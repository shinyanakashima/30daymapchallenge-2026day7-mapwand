name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ../protocol/generate.mjs && git diff --exit-code -- src/protocol ../firmware/src/protocol_gen.h
      - run: npm ci
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio run
      - run: ./scripts/merge_bin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mapwand-firmware
          path: |
            firmware/prebuilt/mapwand-m5stickc-plus-merged.bin
            firmware/prebuilt/mapwand-m5stickc-plus-merged.bin.sha256
            firmware/.pio/build/m5stickc_plus/firmware.bin
