; MapWand firmware — M5StickC Plus + Hat Mini EncoderC
; 依存バージョンはすべて固定する。更新するときは実機で確認してから変える。
[platformio]
default_envs = m5stickc_plus

[env:m5stickc_plus]
platform = espressif32@6.13.0
board = m5stick-c                 ; M5StickC / M5StickC Plus 共通（ESP32-PICO-D4）。Plus2 ではない
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  m5stack/M5Unified@0.2.25
  m5stack/M5GFX@0.2.32
  h2zero/NimBLE-Arduino@2.5.1
  https://github.com/m5stack/M5Hat-Mini-EncoderC.git#38b0dd94b86c5c3e93978458515a8279d60d2ee6
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
